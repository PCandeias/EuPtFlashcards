<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>European Portuguese Flashcards</title>
<style>
:root {
  --bg:#0f172a; --panel:#111827; --panel2:#1f2937; --text:#e5e7eb; --muted:#94a3b8;
  --accent:#38bdf8; --good:#22c55e; --bad:#fb7185; --border:rgba(148,163,184,.24);
}
* { box-sizing:border-box; }
html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
body {
  background:
    radial-gradient(circle at top left, rgba(56,189,248,.18), transparent 24rem),
    radial-gradient(circle at bottom right, rgba(34,197,94,.10), transparent 26rem),
    var(--bg);
}
.app {
  min-height:100svh;
  width:min(1080px, 100%);
  margin:0 auto;
  padding:16px;
  display:grid;
  grid-template-rows:auto auto 1fr auto;
  gap:12px;
}
.header {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
}
h1 { margin:0 0 4px; font-size:clamp(24px,4vw,42px); line-height:1; letter-spacing:-.04em; }
.sub { margin:0; color:var(--muted); line-height:1.4; font-size:14px; }
.stats { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.stat { min-width:86px; padding:10px 12px; background:rgba(17,24,39,.72); border:1px solid var(--border); border-radius:14px; }
.stat b { display:block; font-size:18px; }
.stat span { color:var(--muted); font-size:11px; }
.topbar {
  display:grid;
  grid-template-columns:minmax(180px,1fr) minmax(160px,220px) minmax(160px,220px) auto auto;
  gap:8px;
  align-items:center;
}
select, button {
  font:inherit;
}
select {
  width:100%;
  min-height:44px;
  padding:8px 10px;
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--text);
  background:rgba(15,23,42,.92);
}
button {
  min-height:44px;
  padding:8px 12px;
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--text);
  background:rgba(15,23,42,.86);
  cursor:pointer;
}
button:active { transform:translateY(1px); }
.primary { border-color:rgba(56,189,248,.55); background:rgba(56,189,248,.16); }
.good { border-color:rgba(34,197,94,.55); background:rgba(34,197,94,.15); }
.bad { border-color:rgba(251,113,133,.55); background:rgba(251,113,133,.14); }
.study {
  min-height:0;
  display:grid;
  grid-template-rows:auto minmax(240px,1fr) auto;
  gap:10px;
}
.meta {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  color:var(--muted);
  font-size:13px;
}
.meta .deckname {
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.cardwrap { perspective:1400px; min-height:0; }
.card {
  height:100%;
  min-height:300px;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .32s ease;
  touch-action:pan-y;
}
.card.flipped { transform:rotateY(180deg); }
.face {
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:28px;
  border:1px solid var(--border);
  border-radius:26px;
  background:linear-gradient(145deg, rgba(30,41,59,.98), rgba(15,23,42,.98));
  backface-visibility:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.06);
}
.back { transform:rotateY(180deg); }
.label { color:var(--accent); text-transform:uppercase; letter-spacing:.14em; font-size:12px; font-weight:800; margin-bottom:16px; }
.word { font-size:clamp(32px,7vw,72px); line-height:1.08; text-align:center; font-weight:800; letter-spacing:-.04em; overflow-wrap:anywhere; }
.note { color:var(--muted); font-size:13px; margin-top:16px; text-align:center; }
/* Grammar metadata rides alongside the word as superscript pills, never inside it.
   Sized independently of .word's clamp() so they stay legible on narrow screens. */
.badges { display:inline-flex; gap:4px; vertical-align:top; margin-left:.14em; white-space:nowrap; }
.badge {
  font-size:clamp(10px,1.5vw,13px);
  font-weight:800;
  letter-spacing:.06em;
  line-height:1;
  padding:3px 6px;
  border-radius:999px;
  border:1px solid currentColor;
  background:rgba(15,23,42,.55);
}
.badge.gender   { color:#2dd4bf; }
.badge.gender-f { color:#fb7185; }
.badge.number   { color:#38bdf8; }
.badge.informal { color:#fbbf24; }
.badge.formal   { color:#a78bfa; }
.badge.role     { color:#94a3b8; }
/* Meaning-level disambiguation that can't compress to a letter (ser vs estar). */
.hint { color:var(--muted); font-size:clamp(12px,2.2vw,15px); font-weight:600; margin-top:12px; text-align:center; letter-spacing:0; }
.controls {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}
.footer { color:var(--muted); font-size:12px; line-height:1.4; text-align:center; }
.empty { padding:40px; text-align:center; color:var(--muted); }
@media (max-width:760px) {
  .app { padding:8px; gap:8px; }
  .header { display:block; }
  h1 { font-size:22px; }
  .sub { font-size:12px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .stats { display:none; }
  .topbar { grid-template-columns:1fr 1fr; gap:6px; }
  #deckSelect { grid-column:1 / -1; }
  #shuffleBtn, #resetBtn { min-height:38px; font-size:13px; }
  select { min-height:40px; font-size:14px; }
  .study { grid-template-rows:auto minmax(190px,1fr) auto; gap:6px; }
  .meta { font-size:11px; line-height:1.2; }
  .card { min-height:0; height:calc(100svh - 292px); max-height:52svh; }
  .face { padding:16px; border-radius:20px; }
  .label { font-size:10px; margin-bottom:10px; }
  .word { font-size:clamp(26px,10vw,48px); letter-spacing:-.025em; }
  .badges { gap:3px; margin-left:.14em; }
  .badge { font-size:10px; padding:2px 5px; letter-spacing:.04em; }
  .hint { font-size:12px; margin-top:8px; }
  .note { font-size:11px; margin-top:10px; }
  .controls { grid-template-columns:1fr 1fr 1fr; gap:6px; }
  .controls button { min-height:40px; padding:7px 8px; font-size:13px; }
  #knownBtn { grid-column:span 2; font-weight:800; }
  .footer { display:none; }
}
@media (max-width:420px) {
  h1 { font-size:20px; }
  .sub { display:none; }
  .topbar { grid-template-columns:1fr; }
  .card { height:calc(100svh - 264px); max-height:54svh; }
  .controls { grid-template-columns:1fr 1fr; }
  #flipBtn { grid-column:1 / -1; order:-1; }
  #knownBtn { grid-column:auto; }
}
@media (max-height:700px) and (max-width:760px) {
  .topbar button { display:none; }
  .card { height:calc(100svh - 220px); max-height:58svh; }
  .note { display:none; }
  .controls button { min-height:36px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div>
      <h1>European Portuguese Flashcards</h1>
      <p class="sub">Single-file offline app with 1853 embedded cards, including a Class deck from your Portuguese course notes. Mobile-first, randomized, and self-contained.</p>
    </div>
    <div class="stats">
      <div class="stat"><b id="totalCount">0</b><span>Total</span></div>
      <div class="stat"><b id="dueCount">0</b><span>Due</span></div>
      <div class="stat"><b id="knownCount">0</b><span>Known</span></div>
    </div>
  </header>

  <section class="topbar">
    <select id="deckSelect" aria-label="Deck"></select>
    <select id="directionSelect" aria-label="Direction">
      <option value="a-b">English → Portuguese · Portugal</option>
      <option value="b-a">Portuguese · Portugal → English</option>
    </select>
    <select id="delaySelect" aria-label="Known-card delay">
      <option value="1">Delay: 1 day</option>
      <option value="3" selected>Delay: 3 days</option>
      <option value="7">Delay: 7 days</option>
      <option value="14">Delay: 14 days</option>
      <option value="30">Delay: 30 days</option>
    </select>
    <button id="shuffleBtn">Shuffle</button>
    <button id="resetBtn">Reset deck</button>
  </section>

  <main class="study">
    <div class="meta">
      <span class="deckname" id="deckName"></span>
      <span id="progressText"></span>
    </div>
    <div class="cardwrap" id="cardArea"></div>
    <div class="controls">
      <button id="prevBtn">← Prev</button>
      <button id="flipBtn" class="primary">Flip</button>
      <button id="nextBtn">Next →</button>
      <button id="againBtn" class="bad">Again</button>
      <button id="knownBtn" class="good">Known</button>
    </div>
  </main>

  <div class="footer">Keyboard: Space flips, ←/→ moves. Mobile: tap to flip, swipe left/right to move.</div>
</div>

  const now = () => Date.now();

  const state = {
    deck: localStorage.getItem(PREFIX + "_deck") || "All",
    direction: localStorage.getItem(PREFIX + "_direction") || "a-b",
    delayDays: Number(localStorage.getItem(PREFIX + "_delay") || 3),
    progress: JSON.parse(localStorage.getItem(PREFIX + "_progress") || "{}"),
    order: [],
    orderKey: "",
    index: 0,
    flipped: false
  };

  const cardId = c => `${c.deck}::${c[OTHER_KEY]}::${c[LANG_KEY]}`;

  // Grammar metadata used to live inside the English text ("you plural come"), so
  // lifting it out changed every affected card's id. Remap saved progress by
  // deck + Portuguese, which this change left untouched. A handful of cards share
  // a deck+Portuguese pair (the Class deck repeats entries from earlier decks);
  // those are skipped rather than guessed at.
  function migrateProgress() {
    const SCHEMA = "2";
    if (localStorage.getItem(PREFIX + "_schema") === SCHEMA) return;

    const byDeckPt = new Map();
    for (const c of CARDS) {
      const k = `${c.deck}::${c[LANG_KEY]}`;
      byDeckPt.set(k, byDeckPt.has(k) ? null : cardId(c));
    }

    const live = new Set(CARDS.map(cardId));
    const migrated = {};
    for (const [key, value] of Object.entries(state.progress)) {
      if (live.has(key)) { migrated[key] = value; continue; }
      const parts = key.split("::");
      if (parts.length < 3) continue;
      const target = byDeckPt.get(`${parts[0]}::${parts[parts.length - 1]}`);
      if (target && !migrated[target]) migrated[target] = value;
    }

    state.progress = migrated;
    localStorage.setItem(PREFIX + "_progress", JSON.stringify(migrated));
    localStorage.setItem(PREFIX + "_schema", SCHEMA);
  }

  function save() {
    localStorage.setItem(PREFIX + "_deck", state.deck);
    localStorage.setItem(PREFIX + "_direction", state.direction);
    localStorage.setItem(PREFIX + "_delay", String(state.delayDays));
    localStorage.setItem(PREFIX + "_progress", JSON.stringify(state.progress));
  }

  function escapeHtml(v) {
    return String(v)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  // Grammar metadata never appears in the word itself; it is rendered as a badge.
  const TAGS = {
    masc:        { pill:"M",   cls:"gender",   full:"masculine" },
    "masc-mixed":{ pill:"M+",  cls:"gender",   full:"masculine or mixed group" },
    fem:         { pill:"F",   cls:"gender-f", full:"feminine" },
    plural:      { pill:"PL",  cls:"number",   full:"plural — vocês / eles" },
    informal:    { pill:"INF", cls:"informal", full:"informal — tu" },
    formal:      { pill:"FML", cls:"formal",   full:"formal — você / o senhor" },
    object:      { pill:"OBJ", cls:"role",     full:"object pronoun" },
    contraction: { pill:"CTR", cls:"role",     full:"contraction — preposition + article" }
  };
  const TAG_ORDER = ["masc","masc-mixed","fem","plural","informal","formal","object","contraction"];

  // Which badges a given face earns. The English is the underspecified side —
  // "you come" cannot tell you `tu vens` from `vocês vêm` — whereas the Portuguese
  // form already spells the distinction out, so it stays bare. The exception is
  // bare function words (o, a, no, na), which opt in via ptTags.
  function tagsForFace(card, key) {
    const tags = key === OTHER_KEY ? card.tags : card.ptTags;
    if (!Array.isArray(tags)) return [];
    return tags.filter(t => TAGS[t]).sort((a,b) => TAG_ORDER.indexOf(a) - TAG_ORDER.indexOf(b));
  }

  function badgesHtml(card, key) {
    const tags = tagsForFace(card, key);
    if (!tags.length) return "";
    const pills = tags.map(t => {
      const { pill, cls, full } = TAGS[t];
      return `<span class="badge ${cls}" title="${escapeHtml(full)}" aria-label="${escapeHtml(full)}">${escapeHtml(pill)}</span>`;
    }).join("");
    return `<span class="badges">${pills}</span>`;
  }

  // Meaning-level disambiguation (ser vs estar, "said by a man") gets its own line —
  // it carries real information and cannot compress to a letter.
  function hintHtml(card, key) {
    if (key !== OTHER_KEY || !card.sense) return "";
    return `<div class="hint">${escapeHtml(card.sense)}</div>`;
  }

  function faceHtml(card, key, label) {
    return `
          <div class="label">${escapeHtml(label)}</div>
          <div class="word">${escapeHtml(card[key])}${badgesHtml(card, key)}</div>
          ${hintHtml(card, key)}`;
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function allDecks() {
    const counts = new Map();
    for (const c of CARDS) counts.set(c.deck, (counts.get(c.deck) || 0) + 1);
    return [["All", CARDS.length], ...[...counts.entries()].sort((a,b)=>a[0].localeCompare(b[0]))];
  }

  function filtered(includeDeferred=false) {
    let list = state.deck === "All" ? CARDS : CARDS.filter(c => c.deck === state.deck);
    if (includeDeferred) return list;
    return list.filter(c => {
      const p = state.progress[cardId(c)];
      return !p || !p.nextDue || p.nextDue <= now();
    });
  }

  function resetOrder() {
    state.order = [];
    state.orderKey = "";
  }

  function randomized(includeDeferred=false) {
    const base = filtered(includeDeferred);
    const key = state.deck + "::" + includeDeferred + "::" + base.map(cardId).join("|");
    if (state.orderKey !== key) {
      state.orderKey = key;
      state.order = shuffle(base.map(cardId));
      state.index = 0;
    }
    const byId = new Map(base.map(c => [cardId(c), c]));
    return state.order.map(id => byId.get(id)).filter(Boolean);
  }

  function currentList() {
    const due = filtered(false);
    return due.length ? randomized(false) : randomized(true);
  }

  function currentCard() {
    const list = currentList();
    if (!list.length) return null;
    state.index = ((state.index % list.length) + list.length) % list.length;
    return list[state.index];
  }

  function renderDecks() {
    const sel = $("deckSelect");
    sel.innerHTML = "";
    for (const [deck, count] of allDecks()) {
      const opt = document.createElement("option");
      opt.value = deck;
      opt.textContent = `${deck} (${count})`;
      opt.selected = deck === state.deck;
      sel.appendChild(opt);
    }
  }

  function renderStats() {
    $("totalCount").textContent = CARDS.length;
    $("dueCount").textContent = filtered(false).length;
    $("knownCount").textContent = Object.values(state.progress).filter(p => p.knownCount > 0).length;
  }

  function renderCard() {
    const list = currentList();
    const card = currentCard();
    const area = $("cardArea");
    if (!card) {
      area.innerHTML = `<div class="empty">No cards in this deck.</div>`;
      return;
    }

    const frontKey = state.direction === "a-b" ? OTHER_KEY : LANG_KEY;
    const backKey = state.direction === "a-b" ? LANG_KEY : OTHER_KEY;
    const frontLabel = state.direction === "a-b" ? OTHER_LABEL : LANG_LABEL;
    const backLabel = state.direction === "a-b" ? LANG_LABEL : OTHER_LABEL;
    const dueCount = filtered(false).length;

    $("deckName").textContent = card.deck;
    $("progressText").textContent = `Card ${state.index + 1} / ${list.length} · ${dueCount} due`;

    area.innerHTML = `
      <div id="flashcard" class="card ${state.flipped ? "flipped" : ""}">
        <section class="face front">${faceHtml(card, frontKey, frontLabel)}
          <div class="note">Tap to flip · swipe left/right to move</div>
        </section>
        <section class="face back">${faceHtml(card, backKey, backLabel)}
          <div class="note">Mark as known to delay this card</div>
        </section>
      </div>`;

    const el = $("flashcard");
    el.onclick = () => flip();
    attachSwipe(el);
  }

  function render() {
    renderDecks();
    $("directionSelect").value = state.direction;
    $("delaySelect").value = String(state.delayDays);
    renderStats();
    renderCard();
  }

  function flip() {
    state.flipped = !state.flipped;
    renderCard();
  }

  function move(delta) {
    const list = currentList();
    if (!list.length) return;
    state.index = (state.index + delta + list.length) % list.length;
    state.flipped = false;
    render();
  }

  function known() {
    const card = currentCard();
    if (!card) return;
    const id = cardId(card);
    const old = state.progress[id] || {};
    state.progress[id] = {
      knownCount: (old.knownCount || 0) + 1,
      nextDue: now() + state.delayDays * 86400000,
      lastSeen: now()
    };
    save();
    resetOrder();
    move(1);
  }

  function again() {
    const card = currentCard();
    if (!card) return;
    const id = cardId(card);
    const old = state.progress[id] || {};
    state.progress[id] = {
      knownCount: old.knownCount || 0,
      nextDue: 0,
      lastSeen: now()
    };
    save();
    move(1);
  }

  function resetDeck() {
    for (const c of filtered(true)) delete state.progress[cardId(c)];
    state.index = 0;
    state.flipped = false;
    resetOrder();
    save();
    render();
  }

  function attachSwipe(el) {
    let sx = 0, sy = 0, st = 0;
    el.addEventListener("touchstart", e => {
      if (!e.changedTouches.length) return;
      const t = e.changedTouches[0];
      sx = t.clientX; sy = t.clientY; st = Date.now();
    }, {passive:true});
    el.addEventListener("touchend", e => {
      if (!e.changedTouches.length) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - sx;
      const dy = t.clientY - sy;
      const dt = Date.now() - st;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 800) {
        e.preventDefault();
        move(dx < 0 ? 1 : -1);
      }
    }, {passive:false});
  }

  $("deckSelect").onchange = e => {
    state.deck = e.target.value;
    state.index = 0;
    state.flipped = false;
    resetOrder();
    save();
    render();
  };
  $("directionSelect").onchange = e => {
    state.direction = e.target.value;
    state.flipped = false;
    save();
    render();
  };
  $("delaySelect").onchange = e => {
    state.delayDays = Number(e.target.value);
    save();
    render();
  };
  $("shuffleBtn").onclick = () => {
    state.index = 0;
    state.flipped = false;
    resetOrder();
    render();
  };
  $("resetBtn").onclick = resetDeck;
  $("prevBtn").onclick = () => move(-1);
  $("nextBtn").onclick = () => move(1);
  $("flipBtn").onclick = flip;
  $("againBtn").onclick = again;
  $("knownBtn").onclick = known;

  document.addEventListener("keydown", e => {
    if (["SELECT","INPUT","BUTTON"].includes(e.target.tagName)) return;
    if (e.code === "Space") { e.preventDefault(); flip(); }
    if (e.key === "ArrowRight" || e.key.toLowerCase() === "n") move(1);
    if (e.key === "ArrowLeft") move(-1);
    if (e.key.toLowerCase() === "k") known();
    if (e.key.toLowerCase() === "r") again();
  });

  migrateProgress();
  render();
})();
</script>
</body>
</html>
