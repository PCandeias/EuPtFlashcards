name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deployments queue rather than cancel each other. A cancelled deploy leaves the
# site on the previous version with nothing obviously wrong, which is worse than
# waiting: it looks like the push simply did not take.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Type-check, unit and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Install browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # WebKit is the closest available engine to the iPhone this app is used on, but
  # it needs system libraries that are not on every development machine, so these
  # runs have never been seen locally. Reported, not gating, until they have been
  # green for a while — a deploy should not be blocked by an engine difference
  # nobody has looked at yet.
  safari:
    name: WebKit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --project=ios-safari
        env:
          WEBKIT: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: webkit-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # Job-level permissions replace the top-level block rather than adding to
      # it, so contents: read has to be repeated here or checkout has nothing but
      # anonymous access — which happens to work while the repo is public and
      # would break the moment it is not.
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
        # Turns Pages on for the repository if it is not already, so the site does
        # not need a setting changed by hand before the first deploy.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # dist/.nojekyll is a dotfile, and this action drops dotfiles unless
          # told otherwise.
          include-hidden-files: true

      # Creating the deployment mints a fresh OIDC token and hands it to the
      # Pages API, which occasionally rejects it ("No keys from key endpoint
      # match the id token") while GitHub rotates its signing keys. It is a
      # GitHub-side hiccup, not a problem with the build, and re-running the
      # failed job does not help: the retry reuses the same run and fails the
      # same way. Retrying inside the run, after a pause long enough for the new
      # key to have propagated, turns a red deploy into a slow one.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
