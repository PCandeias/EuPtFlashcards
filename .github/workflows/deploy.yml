name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deployments queue rather than cancel each other. A cancelled deploy leaves the
# site on the previous version with nothing obviously wrong, which is worse than
# waiting: it looks like the push simply did not take.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Type-check, unit and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Install browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # WebKit is the closest available engine to the iPhone this app is used on, but
  # it needs system libraries that are not on every development machine, so these
  # runs have never been seen locally. Reported, not gating, until they have been
  # green for a while — a deploy should not be blocked by an engine difference
  # nobody has looked at yet.
  safari:
    name: WebKit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --project=ios-safari
        env:
          WEBKIT: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: webkit-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        # Turns Pages on for the repository if it is not already, so the site does
        # not need a setting changed by hand before the first deploy.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
